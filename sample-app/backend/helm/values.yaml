image:
  repository: acrsorcerysorcery01.azurecr.io/server-sorcery-101-backend
  tag: "3d0688f"
  pullPolicy: IfNotPresent

replicaCount: 1

nodeSelector:
  kubernetes.azure.com/agentpool: main

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

service:
  port: 8080

env:
  DB_HOST: psql-test-sorcery.postgres.database.azure.com
  DB_PORT: "5432"
  DB_USER: pgadmin
  DB_NAME: postgres
  DB_SSLMODE: require

dbSecretName: postgres-credentials

serviceMonitor:
  enabled: true
