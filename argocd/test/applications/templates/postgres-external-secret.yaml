apiVersion: v1
kind: Namespace
metadata:
  name: sample-app
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: sample-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault-test
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: postgres-admin-password
