defaultRules:
  create: false

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeApiServer:
  enabled: true

prometheus:
  prometheusSpec:
    nodeSelector:
      kubernetes.azure.com/agentpool: tools
    tolerations:
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: spot
        effect: NoSchedule
    resources:
      requests:
        cpu: 150m
        memory: 300Mi
      limits:
        cpu: 300m
        memory: 512Mi
    retention: 12h
    serviceMonitorSelectorNilUsesHelmValues: true
    ruleSelectorNilUsesHelmValues: true

alertmanager:
  alertmanagerSpec:
    nodeSelector:
      kubernetes.azure.com/agentpool: tools
    tolerations:
      - key: kubernetes.azure.com/scalesetpriority
        operator: Equal
        value: spot
        effect: NoSchedule
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    secrets:
      - alertmanager-slack-webhook
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack-notifications
      routes: []
      group_by: ['alertname']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
    receivers:
      - name: slack-notifications
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/url
            channel: '#alerts'
            send_resolved: true
            title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

grafana:
  nodeSelector:
    kubernetes.azure.com/agentpool: tools
  tolerations:
    - key: kubernetes.azure.com/scalesetpriority
      operator: Equal
      value: spot
      effect: NoSchedule
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 512Mi
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "default"
          orgId: 1
          folder: ""
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  dashboards:
    default:
      k8s-cluster:
        gnetId: 315
        revision: 3
        datasource: Prometheus
      postgres:
        gnetId: 9628
        revision: 8
        datasource: Prometheus
      backend-app:
        json: |
          {
            "title": "Server Sorcery Backend",
            "uid": "backend-app",
            "schemaVersion": 39,
            "time": { "from": "now-6h", "to": "now" },
            "panels": [
              {
                "id": 1,
                "type": "stat",
                "title": "Backend Up",
                "gridPos": { "x": 0, "y": 0, "w": 6, "h": 6 },
                "datasource": "Prometheus",
                "targets": [ { "expr": "up{job=\"backend\"}", "datasource": "Prometheus" } ]
              },
              {
                "id": 2,
                "type": "stat",
                "title": "History Requests Total",
                "gridPos": { "x": 6, "y": 0, "w": 6, "h": 6 },
                "datasource": "Prometheus",
                "targets": [ { "expr": "backend_history_requests_total", "datasource": "Prometheus" } ]
              },
              {
                "id": 3,
                "type": "timeseries",
                "title": "Goroutines",
                "gridPos": { "x": 0, "y": 6, "w": 12, "h": 8 },
                "datasource": "Prometheus",
                "targets": [ { "expr": "go_goroutines{job=\"backend\"}", "datasource": "Prometheus" } ]
              },
              {
                "id": 4,
                "type": "timeseries",
                "title": "Heap Allocated Bytes",
                "gridPos": { "x": 0, "y": 14, "w": 12, "h": 8 },
                "datasource": "Prometheus",
                "targets": [ { "expr": "go_memstats_alloc_bytes{job=\"backend\"}", "datasource": "Prometheus" } ]
              }
            ]
          }

additionalPrometheusRulesMap:
  server-sorcery-alerts:
    groups:
      - name: server-sorcery-alerts
        rules:
          - alert: NodeHighCPU
            expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Node {{ $labels.instance }} CPU usage is high"
              description: "CPU usage on {{ $labels.instance }} has been above 80% for 10 minutes."
          - alert: NodeLowDisk
            expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 15
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Node {{ $labels.instance }} disk space is low"
              description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has less than 15% free space."
          - alert: NodeHighMemory
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Node {{ $labels.instance }} memory usage is high"
              description: "Memory usage on {{ $labels.instance }} has been above 85% for 10 minutes."
          - alert: PodRestartingTooOften
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting too often"
              description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has restarted more than 3 times in 15 minutes."
          - alert: ContainerMemoryHigh
            expr: (container_memory_working_set_bytes{container!="",container!="POD"} / (container_spec_memory_limit_bytes{container!="",container!="POD"} > 0)) * 100 > 90
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} memory usage is high"
              description: "Container is using more than 90% of its memory limit."
          - alert: PodPendingTooLong
            expr: sum by (namespace, pod) (kube_pod_status_phase{phase="Pending"}) > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been Pending too long"
              description: "Pod has been stuck in Pending for more than 10 minutes."
          - alert: APIServerUnreachable
            expr: up{job="apiserver"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Kubernetes API server target is unreachable"
              description: "Prometheus cannot scrape the apiserver target."
          - alert: PostgresExporterDown
            expr: up{job="postgres-exporter-prometheus-postgres-exporter"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Postgres exporter target is unreachable"
              description: "Prometheus cannot scrape the postgres-exporter target, so Postgres health and connection alerts are blind."
          - alert: PostgresConnectionsHigh
            expr: sum(pg_stat_activity_count) / pg_settings_max_connections * 100 > 80
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Postgres connection usage is high"
              description: "Active connections have exceeded 80% of max_connections for 10 minutes."
