apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-backup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/kipkiruivans/server-sorcery-101.git
    targetRevision: main
    path: sample-app/backup/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
