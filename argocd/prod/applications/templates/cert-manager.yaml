apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.19.1
    helm:
      values: |
{{ .Files.Get "values-cert-manager.yaml" | indent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # Two independent sources of drift on both webhook configs, neither a
  # real problem:
  #  - cert-manager-cainjector continuously writes the live CA into
  #    clientConfig.caBundle, a field Helm renders empty.
  #  - AKS itself auto-injects extra namespaceSelector.matchExpressions
  #    entries (control-plane, kubernetes.azure.com/managedby) into any
  #    webhook config as a platform safety net, on top of whatever Helm
  #    rendered.
  # Both make Argo report permanent OutOfSync on an object that is
  # otherwise correct and Healthy - ignore just these fields.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: cert-manager-webhook
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
        - '.webhooks[]?.namespaceSelector.matchExpressions'
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: cert-manager-webhook
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
        - '.webhooks[]?.namespaceSelector.matchExpressions'
